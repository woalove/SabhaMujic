name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  linux:
    name: Linux build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore SabhaMujic.slnx
      - run: dotnet build SabhaMujic.slnx --no-restore -c Release
      - run: dotnet test SabhaMujic.slnx --no-build -c Release --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: TestResults

  windows:
    name: Windows build + tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore SabhaMujic.slnx
      - run: dotnet build SabhaMujic.slnx --no-restore -c Release
      - run: dotnet test SabhaMujic.slnx --no-build -c Release --logger "trx" --results-directory TestResults
      - name: Publish desktop + service (self-contained win-x64)
        shell: pwsh
        run: |
          dotnet publish src/SabhaMujic.Desktop -c Release -o artifacts/desktop
          dotnet publish src/SabhaMujic.Service -c Release -o artifacts/service
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: TestResults
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: artifacts
          retention-days: 7
