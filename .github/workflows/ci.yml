name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  linux:
    name: Linux build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore SabhaMujic.slnx
      - run: dotnet build SabhaMujic.slnx --no-restore -c Release
      - run: dotnet test SabhaMujic.slnx --no-build -c Release --filter "Category!=Performance" --blame-hang --blame-hang-timeout 5m --logger "trx" --logger "console;verbosity=minimal" --results-directory TestResults
      # Wall-clock performance budgets run alone, after the main suite, so parallel test load can't skew them.
      - run: dotnet test tests/SabhaMujic.Audio.Tests --no-build -c Release --filter "Category=Performance" --logger "console;verbosity=normal"
      # Uploads are best-effort: the account's artifact storage quota may be exhausted.
      # Artifact storage is a shared, limited account quota: keep test results only when something failed.
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: linux-test-results
          path: TestResults
          retention-days: 3

  windows:
    name: Windows build + tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore SabhaMujic.slnx
      - run: dotnet build SabhaMujic.slnx --no-restore -c Release
      - run: dotnet test SabhaMujic.slnx --no-build -c Release --filter "Category!=Performance" --blame-hang --blame-hang-timeout 5m --logger "trx" --logger "console;verbosity=minimal" --results-directory TestResults
      # Wall-clock performance budgets run alone, after the main suite, so parallel test load can't skew them.
      - run: dotnet test tests/SabhaMujic.Audio.Tests --no-build -c Release --filter "Category=Performance" --logger "console;verbosity=normal"
      # Uploads are best-effort: the account's artifact storage quota may be exhausted.
      # Artifact storage is a shared, limited account quota: keep test results only when something failed.
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: windows-test-results
          path: TestResults
          retention-days: 3

  # Independent of the test job, so installer results are always reported even when a test fails.
  windows-installer:
    name: Windows installer (MSI build + install smoke test)
    runs-on: windows-latest
    # Two MSI builds and several msiexec runs.
    timeout-minutes: 40
    # contents: write is only used by the manual-run step that publishes the MSI as a pre-release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish desktop + service (self-contained win-x64)
        shell: pwsh
        run: |
          dotnet publish src/SabhaMujic.Desktop -c Release -o artifacts/desktop
          dotnet publish src/SabhaMujic.Service -c Release -o artifacts/service
      # MSI (WiX 5.0.2) from the publish output above. 0.1.0 is only the "old version" for the upgrade test; the
      # 0.1.<run number> MSI is the one uploaded, so successive CI builds upgrade each other.
      - name: Build MSIs
        shell: pwsh
        run: |
          ./installer/build.ps1 -SkipPublish -Version 0.1.0
          ./installer/build.ps1 -SkipPublish -Version "0.1.${{ github.run_number }}"
      - name: Installer smoke test (silent install, uninstall, reinstall, upgrade, downgrade refused)
        shell: pwsh
        run: >-
          ./installer/smoke-test.ps1
          -Msi artifacts/SabhaMujic-0.1.0-x64.msi -Version 0.1.0
          -UpgradeMsi "artifacts/SabhaMujic-0.1.${{ github.run_number }}-x64.msi" -UpgradeVersion "0.1.${{ github.run_number }}"
          -LogDir artifacts/install-logs
      # Manual runs (Actions → CI → Run workflow) publish the tested MSI as a GitHub pre-release. Release files don't
      # count against the account's Actions artifact storage quota (which has been full). Only the newest test build
      # is kept: older "installer-*" pre-releases and their tags are deleted.
      - name: Publish installer as a pre-release (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          $version = '0.1.${{ github.run_number }}'
          $tag = "installer-$version"
          $msi = "artifacts/SabhaMujic-$version-x64.msi"
          $notes = @"
          Test build $version of SabhaMujic from branch ${{ github.ref_name }} (commit ${{ github.sha }}).
          This exact MSI passed the automated install, uninstall, upgrade and downgrade checks on Windows.

          - Unsigned: Windows SmartScreen will warn; choose "More info" then "Run anyway".
          - Setup: docs/SETUP.md. Manual checks still to do: docs/WINDOWS_TEST_CHECKLIST.md.
          "@
          gh release create $tag $msi --repo $repo --target '${{ github.sha }}' --prerelease --title "SabhaMujic $version (test build)" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
          $old = gh release list --repo $repo --limit 100 --json tagName,isPrerelease | ConvertFrom-Json |
              Where-Object { $_.isPrerelease -and $_.tagName -like 'installer-*' -and $_.tagName -ne $tag }
          foreach ($r in $old) {
              Write-Host "Deleting older test build $($r.tagName)"
              gh release delete $r.tagName --repo $repo --yes --cleanup-tag
          }
          Write-Host "Published: https://github.com/$repo/releases/tag/$tag"
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: windows-install-logs
          path: artifacts/install-logs
          retention-days: 3
